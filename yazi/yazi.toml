[mgr]

linemode = "size_and_mtime"
show_hidden = true
show_symlinks = true
sort_by = "alphabetical"
sort_order = "ascending"
sort_case_insensitive = true
show_icons = true

[opener]
edit = [
    # Inside an embedded nvim ($NVIM set) yazi.nvim opens the file in the parent
    # editor, so don't spawn a nested nvim. Standalone yazi still edits normally.
    {run = '[ -n "$NVIM" ] || nvim "$@"', block = true, for = "unix"}
]
