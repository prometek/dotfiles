source-file ~/.config/tmux/tmux.reset.conf

# ── Général ───────────────────────────────────────────────
set -g prefix ^A
set -g base-index 1          # indexer les fenêtres à partir de 1
set -g pane-base-index 1     # indexer les panes à partir de 1
set -g renumber-windows on   # renuméroter les fenêtres après fermeture
set -g detach-on-destroy off # ne pas quitter tmux à la fermeture d'une session

# ── Confort ───────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0        # pas de lag sur ESC (nvim)
set -g focus-events on       # autoread nvim
setw -g mode-keys vi         # copie style vi

# ── Terminal ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',alacritty:RGB'
set-option -ga terminal-features ',alacritty:usstyle'
set-option -ga terminal-overrides ',alacritty:Tc'

set-option -g status-position top

# ── Catppuccin : on garde le theme (panes/messages/mode/clock) ─
set -g @catppuccin_flavour 'latte'

# ── Plugins TPM ───────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v1.0.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.tmux/plugins/tpm/tpm'

# ── Nom des fenêtres : basename du dossier courant ────────
setw -g automatic-rename on
setw -g allow-rename off
setw -g automatic-rename-format "#{b:pane_current_path}"

# ── Status bar : flat custom (palette Catppuccin Latte) ───
# override APRÈS le run : remplace la barre Catppuccin, garde le reste
set -g status 2                 # 2e ligne = filet sous la barre
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 150
set -g status-style "bg=#eff1f5,fg=#4c4f69"

# session (mauve) à gauche
set -g status-left "#{?client_prefix,#[fg=#1e1e2e bg=#df8e1d bold] PREFIX ,#[fg=#1e1e2e bg=#df8e1d bold] #S }#[fg=#1e1e2e bg=#df8e1d bold]#{?window_zoomed_flag, ZOOM ,}#[fg=#1e1e2e bg=#df8e1d bold]#{?pane_in_mode, COPY ,}#[default] "

# ── Icônes des onglets (cmd -> glyphe U+hex nerdfont) ────
#   nvim             U+e6ae  nf-custom-neovim
#   vim              U+e62b  nf-custom-vim
#   claude (N.N.N) ✳  U+2733  claude = comm = version
#   node             U+e718  nf-dev-nodejs
#   python*          U+e606  nf-dev-python
#   cargo/rustc      U+e7a8  nf-dev-rust
#   rustc            U+e7a8  nf-dev-rust
#   go               U+e627  nf-seti-go
#   docker*          U+e7b0  nf-dev-docker
#   lazygit          U+e702  nf-dev-git
#   git              U+e702  nf-dev-git
#   ruby             U+e739  nf-dev-ruby
#   lua              U+e620  nf-seti-lua
#   ssh              U+f489  nf-oct-terminal
#   *top             U+f080  nf-fa-chart
#   *sh              U+f120  nf-fa-terminal
#   (defaut)         U+f07b  nf-fa-folder
#   change : nerdfonts.com/cheat-sheet -> donne-moi cmd+icône
set -g @tabicon "#{?#{==:#{pane_current_command},nvim},,#{?#{m:*vim,#{pane_current_command}},,#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},✳,#{?#{==:#{pane_current_command},node},,#{?#{m:python*,#{pane_current_command}},,#{?#{==:#{pane_current_command},cargo},,#{?#{==:#{pane_current_command},rustc},,#{?#{==:#{pane_current_command},go},,#{?#{m:docker*,#{pane_current_command}},,#{?#{==:#{pane_current_command},lazygit},,#{?#{==:#{pane_current_command},git},,#{?#{==:#{pane_current_command},ruby},,#{?#{==:#{pane_current_command},lua},,#{?#{==:#{pane_current_command},ssh},,#{?#{m:*top,#{pane_current_command}},,#{?#{m:*sh,#{pane_current_command}},,}}}}}}}}}}}}}}}}"

# liste des fenêtres : courante = pilule mauve arrondie
# styles par défaut alignés sur le fond de barre (sinon bg=default = vert hérité)
setw -g window-status-style "bg=#ece5f8"
setw -g window-status-current-style "bg=#eff1f5"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#9ca0b0] #I #{E:@tabicon} #W "
setw -g window-status-current-format "#[fg=#eff1f5 bg=#8839ef bold] #I #{E:@tabicon} #W "
setw -g window-status-bell-style "fg=#d20f39,bold"

# droite : dossier (discret) · CPU · batterie · heure (mauve)
set -g status-right "#[fg=#6c6f85] #{b:pane_current_path}  #[fg=#df8e1d] #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh 2>/dev/null)  #[fg=#40a02b] #(~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh 2>/dev/null)  #[fg=#8839ef,bold] %a %d %B %Y  %H:%M "

# 2e ligne : filet fin pleine largeur (pas de fill -> hairline)
set -g 'status-format[1]' "#[fg=#ccd0da,align=left]#(yes ─ | head -n $(tmux display -p '#{client_width}') | tr -d '\n')"
